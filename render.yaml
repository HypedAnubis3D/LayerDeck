services:
  - type: web
    name: layerdeck-api
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && node build.mjs
    startCommand: node dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  - type: web
    name: layerdeck-app
    runtime: static
    rootDir: artifacts/studio-manager
    buildCommand: curl -fsSL https://get.pnpm.io/install.sh | PNPM_VERSION=9.15.9 sh - && export PATH="$HOME/.local/share/pnpm:$PATH" && pnpm install --no-frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://layerdeck-api.onrender.com